<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YUMI OS Board</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
  --line: #e3e3e6; --accent: #0071e3; --accent-text: #ffffff;
  --ok: #34a853; --danger: #d93025; --menu-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161617; --card: #1f1f21; --text: #f5f5f7; --muted: #98989d;
    --line: #333336; --accent: #2997ff; --accent-text: #0b0b0c;
    --ok: #4caf70; --danger: #ff6b5e; --menu-bg: #28282b;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 1.45;
}
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 24px; border-bottom: 1px solid var(--line);
  background: var(--card); position: sticky; top: 0; z-index: 5;
}
header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
header h1 span { color: var(--muted); font-weight: 400; }
#search {
  flex: 0 1 260px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text); font: inherit; outline: none;
}
#search:focus { border-color: var(--accent); }
#cats { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
}
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
main { padding: 20px 24px 120px; }
#grid {
  display: grid; grid-template-columns: repeat(auto-fill, 270px);
  gap: 14px; justify-content: start;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative;
}
.card .top { display: flex; align-items: center; gap: 10px; }
.card img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
.card .name { font-weight: 600; font-size: 14px; }
.card .desc {
  color: var(--muted); font-size: 13px; min-height: 2.9em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .foot { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.btn {
  padding: 5px 14px; border-radius: 8px; border: none; font: inherit; font-size: 13px;
  cursor: pointer; background: var(--accent); color: var(--accent-text);
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.ghost { background: none; color: var(--danger); border: 1px solid var(--line); }
.state { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.more {
  margin-left: auto; border: none; background: none; color: var(--muted); cursor: pointer;
  padding: 2px 6px; border-radius: 6px; font-size: 16px; line-height: 1;
}
.more:hover { background: var(--bg); }
.menu {
  position: absolute; right: 10px; bottom: 44px; background: var(--menu-bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.12); z-index: 4;
}
.menu button {
  display: block; width: 100%; text-align: left; padding: 6px 12px; border: none;
  background: none; color: var(--danger); font: inherit; font-size: 13px;
  cursor: pointer; border-radius: 7px;
}
.menu button:hover { background: var(--bg); }
.confirm { display: flex; gap: 8px; align-items: center; }
.confirm span { color: var(--muted); font-size: 13px; }
#drawer {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
  border-top: 1px solid var(--line); transform: translateY(100%);
  transition: transform 0.18s ease; z-index: 6;
}
#drawer.open { transform: translateY(0); }
#drawer .bar {
  display: flex; align-items: center; gap: 10px; padding: 8px 24px; cursor: pointer;
}
#drawer .bar strong { font-size: 13px; font-weight: 600; }
#drawer .bar .st { color: var(--muted); font-size: 13px; }
#drawer .bar .x { margin-left: auto; color: var(--muted); font-size: 13px; }
#log {
  height: 200px; overflow-y: auto; padding: 0 24px 12px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--muted);
}
#empty { color: var(--muted); padding: 40px 0; text-align: center; }
#termbtn { margin-left: auto; }
#term {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
  border-top: 1px solid var(--line); transform: translateY(100%);
  transition: transform 0.18s ease; z-index: 7;
}
#term.open { transform: translateY(0); }
#term iframe { display: block; width: 100%; height: 340px; border: 0; background: #000; }
</style>
</head>
<body>
<header>
  <h1>YUMI OS Board <span>· mini-projets en 1 clic</span></h1>
  <input id="search" type="search" placeholder="Rechercher" autocomplete="off">
  <nav id="cats"></nav>
  <button class="chip" id="termbtn">Terminal</button>
</header>
<main>
  <div id="grid"></div>
  <p id="empty" hidden>Aucune app ne correspond.</p>
</main>
<div id="term">
  <div class="bar" id="termbar">
    <strong>Terminal</strong>
    <span class="x">fermer</span>
  </div>
  <iframe id="termframe" title="Terminal"></iframe>
</div>
<div id="drawer">
  <div class="bar" id="drawerbar">
    <strong id="jobtitle"></strong>
    <span class="st" id="jobstate"></span>
    <span class="x">fermer</span>
  </div>
  <div id="log"></div>
</div>
<script>
"use strict";
let apps = [], cat = "Tout", query = "", busy = false, offset = 0, timer = null;

const $ = (id) => document.getElementById(id);

async function loadApps() {
  apps = await (await fetch("/api/apps")).json() || [];
  renderCats(); render();
}

function renderCats() {
  const names = ["Tout", ...new Set(apps.map(a => a.category).filter(Boolean))];
  $("cats").replaceChildren(...names.map(n => {
    const b = document.createElement("button");
    b.className = "chip" + (n === cat ? " on" : "");
    b.textContent = n;
    b.onclick = () => { cat = n; renderCats(); render(); };
    return b;
  }));
}

function render() {
  const list = apps.filter(a =>
    (cat === "Tout" || a.category === cat) &&
    (!query || a.name.toLowerCase().includes(query) || a.description.toLowerCase().includes(query)));
  $("empty").hidden = list.length > 0;
  $("grid").replaceChildren(...list.map(card));
}

function card(a) {
  const el = document.createElement("div");
  el.className = "card";
  const installed = a.status === "installed";

  const top = document.createElement("div");
  top.className = "top";
  const img = document.createElement("img");
  img.src = "/api/icon/" + encodeURIComponent(a.name);
  img.alt = "";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = a.name;
  top.append(img, name);

  const desc = document.createElement("div");
  desc.className = "desc";
  desc.textContent = a.description;

  const foot = document.createElement("div");
  foot.className = "foot";
  if (installed) {
    const st = document.createElement("span");
    st.className = "state";
    st.innerHTML = '<span class="dot"></span>Installé';
    const more = document.createElement("button");
    more.className = "more";
    more.textContent = "···";
    more.setAttribute("aria-label", "Actions");
    more.onclick = (e) => { e.stopPropagation(); toggleMenu(el, a); };
    foot.append(st, more);
  } else {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = a.status === "corrupted" ? "Réparer" : "Installer";
    b.disabled = busy;
    b.onclick = () => act(a.name, "install");
    foot.append(b);
  }
  el.append(top, desc, foot);
  return el;
}

function toggleMenu(cardEl, a) {
  const old = cardEl.querySelector(".menu");
  closeMenus();
  if (old) return;
  const m = document.createElement("div");
  m.className = "menu";
  const del = document.createElement("button");
  del.textContent = "Désinstaller";
  del.onclick = (e) => { e.stopPropagation(); confirmUninstall(cardEl, a); };
  m.append(del);
  cardEl.append(m);
}

function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", closeMenus);

function confirmUninstall(cardEl, a) {
  closeMenus();
  const foot = cardEl.querySelector(".foot");
  foot.replaceChildren();
  const wrap = document.createElement("div");
  wrap.className = "confirm";
  const label = document.createElement("span");
  label.textContent = "Désinstaller ?";
  const yes = document.createElement("button");
  yes.className = "btn ghost";
  yes.textContent = "Oui";
  yes.onclick = () => act(a.name, "uninstall");
  const no = document.createElement("button");
  no.className = "btn ghost";
  no.style.color = "var(--muted)";
  no.textContent = "Annuler";
  no.onclick = () => render();
  wrap.append(label, yes, no);
  foot.append(wrap);
}

async function act(app, action) {
  if (busy) return;
  const r = await fetch("/api/action", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ App: app, Action: action })
  });
  if (!r.ok) return;
  busy = true; offset = 0;
  $("log").textContent = "";
  $("jobtitle").textContent = (action === "install" ? "Installation de " : "Désinstallation de ") + app;
  $("jobstate").textContent = "en cours";
  $("drawer").classList.add("open");
  render();
  timer = setInterval(poll, 1000);
}

async function poll() {
  const j = await (await fetch("/api/job?offset=" + offset)).json();
  if (!j) return;
  if (j.chunk) {
    offset = j.offset;
    const log = $("log");
    log.textContent += j.chunk.replace(/\x1b\[[0-9;]*m/g, "");
    log.scrollTop = log.scrollHeight;
  }
  if (!j.running) {
    clearInterval(timer); timer = null; busy = false;
    $("jobstate").textContent = j.exit === 0 ? "terminé" : "échec (code " + j.exit + ")";
    loadApps();
  }
}

$("drawerbar").onclick = () => $("drawer").classList.remove("open");
$("termbtn").onclick = () => {
  const frame = $("termframe");
  if (!frame.src) frame.src = "/terminal/";
  $("term").classList.toggle("open");
};
$("termbar").onclick = () => $("term").classList.remove("open");
$("search").oninput = (e) => { query = e.target.value.trim().toLowerCase(); render(); };

loadApps();
</script>
</body>
</html>
